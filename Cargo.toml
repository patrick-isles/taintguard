[package]
name = "taintguard"
version = "0.1.0"
edition = "2024"
description = "Deterministic Information-Flow Control (IFC) and taint-tracking security firewall for MCP AI agents."
license = "MIT"
keywords = ["mcp", "security", "ai-agents", "taint-tracking", "ifc"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
